name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24.x', cache: true }
      - run: go test ./...
      - run: go build -trimpath ./cmd/chainproof
  openclaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: integrations/openclaw/package-lock.json }
      - run: npm ci
        working-directory: integrations/openclaw
      - run: npm run typecheck
        working-directory: integrations/openclaw
